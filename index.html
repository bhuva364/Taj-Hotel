<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taj Hotel — Where Marble Meets Memory</title>
  <meta name="description" content="A heritage-inspired luxury stay: marble courtyards, rooftop dining and rooms framed by hand-carved arches." />

  <!-- Display + body typefaces -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Icons for amenities/social -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Fixed navigation, collapses into a hamburger below 768px (see script.js) -->
  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="#home" class="navbar__logo">Taj<span>Hotel</span></a>
      <nav class="navbar__links" id="navLinks">
        <a href="#home">Home</a>
        <a href="#about">Heritage</a>
        <a href="#rooms">Rooms</a>
        <a href="#amenities">Amenities</a>
        <a href="#gallery">Gallery</a>
        <a href="#testimonials">Guests Say</a>
        <a href="#booking" class="navbar__cta">Book Now</a>
      </nav>
      <button class="navbar__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Hero: full-bleed courtyard image behind an arch-framed headline -->
  <section class="hero" id="home">
    <div class="hero__arch">
      <p class="hero__eyebrow">Est. 1903 &middot; Rebuilt in Marble &amp; Gold</p>
      <h1 class="hero__title">Where Marble<br />Meets Memory</h1>
      <p class="hero__subtitle">A heritage palace turned hotel, framed by hand-carved
        arches, courtyard fountains and views over the old city.</p>
      <div class="hero__actions">
        <a href="#booking" class="btn btn--gold">Reserve a Stay</a>
        <a href="#rooms" class="btn btn--ghost">View Rooms</a>
      </div>
    </div>
    <a href="#about" class="hero__scroll" aria-label="Scroll to next section">&#8595;</a>
  </section>

  <!-- Page sections are injected below, one at a time as the site is built -->

  <script src="js/script.js"></script>
</body>
</html>
